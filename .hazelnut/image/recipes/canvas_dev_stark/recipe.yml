name: "Canvas Dev Stark"
install:
  - canvas
  - stark
recipes:
  - ./core/recipes/article_content_type
config:
  strict:
    # Canvas creates block-backed component entities during install, so these
    # exported component configs are disabled with config actions instead.
    - canvas.page_region.stark.footer
    - canvas.page_region.stark.header
  actions:
    system.theme:
      simpleConfigUpdate:
        default: stark
    ?block.block.stark_account_menu:
      disable: []
    ?block.block.stark_breadcrumbs:
      disable: []
    ?block.block.stark_content:
      disable: []
    ?block.block.stark_help:
      disable: []
    ?block.block.stark_main_menu:
      disable: []
    ?block.block.stark_messages:
      disable: []
    ?block.block.stark_page_title:
      disable: []
    ?block.block.stark_powered:
      disable: []
    ?block.block.stark_primary_admin_actions:
      disable: []
    ?block.block.stark_primary_local_tasks:
      disable: []
    ?block.block.stark_search_form_narrow:
      disable: []
    ?block.block.stark_search_form_wide:
      disable: []
    ?block.block.stark_secondary_local_tasks:
      disable: []
    ?block.block.stark_site_branding:
      disable: []
    canvas.component.block.system_menu_block.footer:
      disable: []
    canvas.component.block.system_menu_block.main:
      disable: []
    canvas.component.block.system_breadcrumb_block:
      disable: []
    canvas.component.block.system_messages_block:
      disable: []
    canvas.component.block.system_powered_by_block:
      disable: []
    canvas.component.block.system_branding_block:
      disable: []
